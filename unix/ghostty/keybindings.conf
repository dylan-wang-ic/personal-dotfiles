# Key behavior only. Keep font/theme/window settings in the host Ghostty config.
# Treat macOS Option as terminal Alt so word editing and tmux modifiers are stable.
macos-option-as-alt = true

# macOS Option and Command text editing is NOT handled here. cmux's Ghostty
# fork pins alt+arrow_*, super+arrow_*, alt+backspace and super+backspace to its
# own macOS defaults and silently discards config overrides for those triggers,
# so the mapping lives in cmux's terminal.textEditingGestures instead
# (see unix/cmux/cmux.json). Rebinding them here has no effect in cmux; it only
# applies to a standalone Ghostty.

# Native cmux/Ghostty surface and split controls. cmux shortcuts take
# precedence when their context matches; these Ghostty actions cover left/up
# splits and alternate-screen programs inside native cmux surfaces.
keybind = ctrl+alt+arrow_left=goto_split:left
keybind = ctrl+alt+arrow_right=goto_split:right
keybind = ctrl+alt+arrow_up=goto_split:up
keybind = ctrl+alt+arrow_down=goto_split:down
keybind = ctrl+alt+shift+arrow_left=new_split:left
keybind = ctrl+alt+shift+arrow_right=new_split:right
keybind = ctrl+alt+shift+arrow_up=new_split:up
keybind = ctrl+alt+shift+arrow_down=new_split:down
# close_surface closes the focused cmux surface/panel. It does not mean close
# the whole workspace or every surface in the surrounding split-pane group.
keybind = ctrl+alt+w=close_surface
# cmux's native remote-tmux mirror currently rejects left/up split placement;
# right/down remain native there. Raw tmux mode below supports all directions.

# Preserve the existing selection and Shift+Enter sequences. Zsh consumes the
# word/line selection sequences without occupying Ctrl+Shift+Left/Right, which
# remain tab navigation keys.
keybind = alt+shift+arrow_left=csi:1;4D
keybind = alt+shift+arrow_right=csi:1;4C
keybind = super+shift+arrow_left=csi:1;2H
keybind = super+shift+arrow_right=csi:1;2F
keybind = shift+enter=csi:13;2u

# Distinguish Ctrl+Backspace from Ctrl+H so Zsh can keep the standard Emacs
# Ctrl+H binding while providing the requested delete-to-line-start action.
keybind = ctrl+backspace=csi:127;5u

# Raw tmux forwarding mode. Use this only in a raw local/SSH tmux client, not
# in cmux's native tmux mirror. Ctrl+Alt+T toggles the table for the focused
# terminal surface. Alternate-screen gating lets the pane focus/split/close
# keys reach this table.
#
# cmux routes app shortcuts before Ghostty and has no context key that separates
# alternate-screen OMP from alternate-screen tmux. cmux therefore keeps the
# Ctrl+Shift surface-tab keys native so OMP can use them. Inside cmux those three
# keys cannot reach raw tmux even in this table; the encodings below remain
# useful in standalone Ghostty, where no cmux app shortcut intercepts them.
keybind = ctrl+alt+t=activate_key_table:tmux-forward
keybind = tmux-forward/ctrl+alt+t=deactivate_key_table

# Modified arrows use standard xterm modifier parameters. Modified letters use
# CSI-u because legacy Ctrl encoding cannot distinguish Ctrl+Shift+W from Ctrl+W.
keybind = tmux-forward/ctrl+alt+arrow_left=csi:1;7D
keybind = tmux-forward/ctrl+alt+arrow_right=csi:1;7C
keybind = tmux-forward/ctrl+alt+arrow_up=csi:1;7A
keybind = tmux-forward/ctrl+alt+arrow_down=csi:1;7B
keybind = tmux-forward/ctrl+alt+shift+arrow_left=csi:1;8D
keybind = tmux-forward/ctrl+alt+shift+arrow_right=csi:1;8C
keybind = tmux-forward/ctrl+alt+shift+arrow_up=csi:1;8A
keybind = tmux-forward/ctrl+alt+shift+arrow_down=csi:1;8B
keybind = tmux-forward/ctrl+alt+w=csi:119;7u
keybind = tmux-forward/ctrl+shift+w=csi:119;6u
keybind = tmux-forward/ctrl+shift+arrow_left=csi:1;6D
keybind = tmux-forward/ctrl+shift+arrow_right=csi:1;6C
