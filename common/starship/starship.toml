"$schema" = 'https://starship.rs/config-schema.json'

# Raise timeout; git_status disabled for monorepo performance
command_timeout = 2000

add_newline = false

# ── layout (pure preset) ─────────────────────────────────────────────────────
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

# ── prompt character (pure) ───────────────────────────────────────────────────
[character]
success_symbol = "[❯](dimmed yellow)[❯](yellow)[❯](bold yellow)"
error_symbol = "[❯](dimmed red)[❯](red)[❯](bold red)"
vimcmd_symbol = "[❮](dimmed green)[❮](green)[❮](bold green)"

# ── directory (pure + nerd font) ─────────────────────────────────────────────
[directory]
style = "cyan"
read_only = " 󰌾"

# ── git (pure + nerd font, status disabled for monorepo perf) ────────────────
[git_branch]
symbol = " "
format = "[$branch]($style)"
style = "purple"

[git_status]
disabled = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_commit]
tag_symbol = '  '

# ── timing (pure) ─────────────────────────────────────────────────────────────
[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

# ── hostname (nerd font ssh icon) ─────────────────────────────────────────────
[hostname]
ssh_symbol = " "

# ── python: virtualenv only, no version (pure + nerd font + no-runtimes) ─────
[python]
symbol = " "
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

# ── language modules: nerd font symbol + no version (no-runtimes) ─────────────
