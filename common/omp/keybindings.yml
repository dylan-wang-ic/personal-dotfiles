tui.editor.cursorWordLeft: [alt+left]
tui.editor.cursorWordRight: [alt+right]
tui.editor.cursorLineStart: [ctrl+left]
tui.editor.cursorLineEnd: [ctrl+right]
tui.editor.deleteWordBackward: [alt+backspace]
tui.editor.deleteWordForward: [alt+delete]
tui.editor.deleteToLineStart: [ctrl+backspace]
tui.editor.deleteToLineEnd: [ctrl+delete]

# Keep temporary model selection alongside the editor navigation bindings.
app.model.selectTemporary: [Alt+P, Alt+O]
